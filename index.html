<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ALOT OF DICES ARE ANNOYING</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #1a1a1a; color: #f5f5f5; padding: 30px; }
        .panel { background: #262626; padding: 20px; border: 2px solid #3e3e3e; border-radius: 6px; max-width: 600px; margin: 0 auto; }
        .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        label { display: block; font-size: 12px; text-transform: uppercase; color: #aaa; margin-bottom: 5px; }
        input, select { width: 90%; background: #111; color: #fff; border: 1px solid #555; padding: 10px; border-radius: 4px; font-size: 16px; }
        button { width: 100%; background: #8b0000; color: white; padding: 15px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 4px; transition: background 0.2s; }
        button:hover { background: #b30000; }
        .window { border: 2px solid #555; background: #0b0b0b; padding: 15px; height: 250px; overflow-y: scroll; margin-top: 20px; border-radius: 4px; }
        .roll-entry { border-bottom: 1px dashed #333; padding: 8px 0; font-size: 14px; }
    </style>
</head>
<body>

    <div class="panel">
        <h2>ROLL HERE FN</h2>
        <hr style="border-color: #444; margin-bottom: 20px;">

        <div class="controls">
            <div>
                <label for="diceCount">Quantity</label>
                <input type="number" id="diceCount" value="1" min="1" max="100">
            </div>
            
            <div>
                <label for="diceType">Dice Type</label>
                <select id="diceType">
                    <option value="4">d4</option>
                    <option value="6" selected>d6</option>
                    <option value="8">d8</option>
                    <option value="10">d10</option>
                    <option value="12">d12</option>
                    <option value="20">d20</option>
                    <option value="100">d100</option>
                </select>
            </div>

            <div>
                <label for="modifier">Modifier (+ / -)</label>
                <input type="number" id="modifier" value="0">
            </div>
        </div>
        
        <button id="rollBtn">EXECUTE ROLL</button>

        <h3>ROLL LOG</h3>
        <div id="logWindow" class="window">System ready. Awaiting input...</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
